name: Sync Game Data

on:
  # Run daily at midnight UTC
  schedule:
    - cron: '0 0 * * *'

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      game:
        description: 'Game to sync (leave empty for all)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - wutheringwave
          - endfield
          - gfl2
          - nte
          - mongilstardive
          - dna

permissions:
  contents: write

# Two syncs at once (a manual run during the daily one) both commit to master; the second push
# is then rejected. Queue them instead of running side by side.
concurrency:
  group: sync-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v5.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync from Google Sheets
        env:
          SHEET_ID_WUTHERINGWAVE: ${{ secrets.SHEET_ID_WUTHERINGWAVE }}
          SHEET_ID_ENDFIELD: ${{ secrets.SHEET_ID_ENDFIELD }}
          SHEET_ID_GIRLSFRONTIER: ${{ secrets.SHEET_ID_GIRLSFRONTIER }}
          SHEET_ID_NTE: ${{ secrets.SHEET_ID_NTE }}
          SHEET_ID_MONGILSTARDIVE: ${{ secrets.SHEET_ID_MONGILSTARDIVE }}
          SHEET_ID_DNA: ${{ secrets.SHEET_ID_DNA }}
        run: |
          if [ -n "${{ github.event.inputs.game }}" ]; then
            node scripts/sync-sheets.js --game=${{ github.event.inputs.game }}
          else
            node scripts/sync-sheets.js
          fi

      - name: Check for changes
        id: changes
        run: |
          git add src/games/*/data/*.json src/games/*/locales/*.json 2>/dev/null || true
          git diff --cached --quiet || echo "has_changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync game data from Google Sheets

          Automated sync by GitHub Actions"
          # master may have moved since checkout (a code push during the run). The bot only
          # commits data/locale files, so rebasing onto it is normally clean; retry a few times.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "::warning::push attempt ${attempt} failed, retrying"
            sleep $((attempt * 5))
          done
          echo "::error::could not push the synced data — master changed in a way that conflicts with it"
          exit 1

      # Runs after the commit on purpose: the sheet is the source of truth, so synced data
      # always lands. A red run is the alert — e.g. a material id the code or tiers.js still
      # expects, a duplicated game_id, or a cost that resolves to nothing
      # (tests/games/data-integrity.test.js). Fix the sheet, re-run the sync.
      - name: Check synced data against the code
        run: npx vitest run
